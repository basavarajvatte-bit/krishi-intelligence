name: Worker deploy

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DATA_GOV_KEY: ${{ secrets.DATA_GOV_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Token hai?
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then unset CLOUDFLARE_ACCOUNT_ID; fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "Cloudflare secrets abhi nahi daale"; exit 1; fi
      - name: Deploy
        run: npx -y wrangler@4 deploy
      - name: Chaabi Worker me daalo
        run: printf '%s' "$DATA_GOV_KEY" | npx -y wrangler@4 secret put DATA_GOV_KEY
