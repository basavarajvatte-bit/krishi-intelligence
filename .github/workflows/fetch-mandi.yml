name: Rozana mandi bhav

on:
  # data.gov.in GitHub (America) ke computers ko rokta hai, isliye abhi sirf haath se chalega.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bhav laao
        env:
          DATA_GOV_KEY: ${{ secrets.DATA_GOV_KEY }}
        run: node scripts/fetch-mandi.mjs
      - name: Save karo
        run: |
          git config user.name "krishi-bot"
          git config user.email "krishi-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Mandi bhav update $(date -u +%F)"
          git push
