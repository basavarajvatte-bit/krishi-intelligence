name: Rozana mandi bhav

on:
  schedule:
    - cron: '17 9 * * *'    # 2:47 PM IST
    - cron: '17 14 * * *'   # 7:47 PM IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bhav laao
        run: node scripts/fetch-mandi.mjs
      - name: Save karo
        run: |
          git config user.name "krishi-bot"
          git config user.email "krishi-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Mandi bhav update $(date -u +%F)"
          git pull --rebase -q origin main || true
          git push
