name: Sarkari faisle tracker

on:
  schedule:
    - cron: '23 */6 * * *'   # har 6 ghante
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/policy-watch.mjs', '.github/workflows/policy-watch.yml']

permissions:
  contents: write
  models: read

concurrency:
  group: policy-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Khabar padho aur samjhao
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/policy-watch.mjs
      - name: Save karo
        run: |
          git config user.name "krishi-bot"
          git config user.email "krishi-bot@users.noreply.github.com"
          git add data/policy-auto.json
          git diff --cached --quiet || git commit -m "Sarkari faisle update $(date -u +%F)"
          git pull --rebase -q origin main || true
          git push
