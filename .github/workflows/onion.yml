name: Onion bhav

on:
  schedule:
    - cron: '47 4 * * *'    # 10:17 AM IST
    - cron: '47 13 * * *'   # 7:17 PM IST
    - cron: '29 * * * *'    # har ghante — sirf jab tak itihaas na aa jaaye
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/commodity.mjs', '.github/workflows/onion.yml']

permissions:
  contents: write

concurrency:
  group: onion
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bhav laao (pehli baar 10 saal ka itihaas bhi)
        env:
          DATA_GOV_KEY: ${{ secrets.DATA_GOV_KEY }}
        run: |
          if [ "${{ github.event.schedule }}" = '29 * * * *' ] && [ -f data/onion/series/index.json ]; then echo 'Itihaas pehle se hai'; exit 0; fi
          if [ ! -f data/onion/series/index.json ] || [ ! -f data/onion/monthly.json ]; then node scripts/commodity.mjs onion --backfill; else node scripts/commodity.mjs onion; fi
      - name: Save karo
        run: |
          git config user.name "krishi-bot"
          git config user.email "krishi-bot@users.noreply.github.com"
          git add data/onion
          git diff --cached --quiet || git commit -m "Onion bhav update $(date -u +%F)"
          git pull --rebase -q origin main || true
          git push
