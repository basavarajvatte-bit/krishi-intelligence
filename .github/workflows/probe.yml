name: Jaanch (ek baar)
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Worker deploy']
    types: [completed]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/probe.mjs
        env:
          DATA_GOV_KEY: ${{ secrets.DATA_GOV_KEY }}
