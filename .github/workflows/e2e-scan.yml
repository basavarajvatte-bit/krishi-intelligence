name: Scanner jaanch (live site)
on:
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q playwright pillow && python -m playwright install --with-deps chromium > /dev/null
      - run: python tests/e2e_scan.py
